name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Placeholder values: the build only needs the vars to exist;
          # real values are injected by Railway at deploy time.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
          VITE_APP_URL: https://placeholder.example.com

  edge-functions:
    name: Type-check edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Functions covered so far; extend this list as others are brought up to
      # a clean `deno check`.
      - name: deno check
        run: |
          for fn in process-scheduled-emails sync-salesforce validate-emails; do
            echo "::group::deno check $fn"
            deno check "supabase/functions/$fn/index.ts"
            echo "::endgroup::"
          done
